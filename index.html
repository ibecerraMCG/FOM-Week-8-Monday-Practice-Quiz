<style>
    /* --- Color Variables --- */
    :root {

        --container-bg: #ffffff;

        --separator-color: #e9ecef;
        --label-bg: #f8f9fa;
        --label-border: #ced4da;

        --label-hover-border: #adb5bd;

        --button-text: white;

        --button-disabled-bg: #6c757d;
        --feedback-correct-bg: #d1e7dd;
        --feedback-correct-text: #0f5132;
        --feedback-correct-border: #badbcc;
        --feedback-incorrect-bg: #f8d7da;
        --feedback-incorrect-text: #842029;
        --feedback-incorrect-border: #f5c2c7;
        --feedback-rationale-text: #495057;
        --feedback-source-text: #343a40;
        --feedback-separator: #ccc;
        --radio-accent: #007bff;

    /* --- General Styles --- */
    body {

        margin: 0;

        color: var(--text-color);
        padding-bottom: 40px;
        transition: background-color 0.3s, color 0.3s;
    }

    #theme-toggle-button {
        position: fixed;
        top: 15px;
        right: 15px;
        padding: 8px 12px;
        background-color: var(--button-bg);
        color: var(--button-text);
        border: 1px solid var(--label-border);
        border-radius: 5px;
        cursor: pointer;
        font-size: 0.9em;
        z-index: 1000;
         transition: background-color 0.3s, color 0.3s;
    }
     #theme-toggle-button:hover {
         opacity: 0.8;
     }


    #quiz-container {
        max-width: 900px;
        margin: 80px auto 30px auto;
        background: var(--container-bg);
        padding: 25px 35px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        border: 1px solid var(--border-color);
        transition: background-color 0.3s, border-color 0.3s;
    }

    .question-block {
        margin-bottom: 35px;
        padding-bottom: 25px;
        border-bottom: 1px solid var(--separator-color);
        transition: border-color 0.3s;
    }

    .question-block:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 5px;
    }
    
    .learning-objective {
        font-size: 0.85em;
        font-style: italic;
        color: var(--lo-text-color);
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 1px dashed var(--separator-color);
    }

    .question-text {
        font-weight: 600;
        font-size: 1.1em;
        margin-bottom: 18px;
        color: var(--question-text-color);
        transition: color 0.3s;
    }

    .options label {
        display: block;
        margin-bottom: 12px;
        cursor: pointer;
        padding: 10px 15px;
        border-radius: 6px;
        border: 1px solid var(--label-border);
        background-color: var(--label-bg);
        transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
    }

    .options label:hover {
        background-color: var(--label-hover-bg);
        border-color: var(--label-hover-border);
    }

    .options input[type="radio"]:checked+span {
         font-weight: bold;
         color: var(--question-text-color);
    }
    .options input[type="radio"] {
        margin-right: 12px;
        accent-color: var(--radio-accent);
    }

    .button-container {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    .check-button {
        padding: 8px 15px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 0.95em;
        transition: background-color 0.2s, color 0.2s, opacity 0.2s;
        background-color: var(--button-bg);
        color: var(--button-text);
    }

    .check-button:hover {
        opacity: 0.85;
    }

     .check-button:disabled {
         background-color: var(--button-disabled-bg);
         cursor: not-allowed;
         opacity: 0.7;
     }

    .feedback {
        margin-top: 20px;
        padding: 15px;
        border-radius: 6px;
        font-size: 0.95em;
        display: none;
        border: 1px solid transparent;
        transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }

    .feedback.correct {
        background-color: var(--feedback-correct-bg);
        color: var(--feedback-correct-text);
        border-color: var(--feedback-correct-border);
        display: block;
    }

    .feedback.incorrect {
        background-color: var(--feedback-incorrect-bg);
        color: var(--feedback-incorrect-text);
        border-color: var(--feedback-incorrect-border);
        display: block;
    }

    .feedback-status {
         font-weight: bold;
         font-size: 1.1em;
         display: block;
         margin-bottom: 8px;
    }

    .feedback-rationale {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed var(--feedback-separator);
        font-size: 0.9em;
        color: var(--feedback-rationale-text);
        transition: color 0.3s, border-color 0.3s;
    }
    
    .feedback-source {
        margin-top: 10px;
        font-size: 0.85em;
        font-style: italic;
        color: var(--feedback-source-text);
        background-color: rgba(0,0,0,0.1);
        padding: 8px;
        border-radius: 4px;
    }

    h1 {
        text-align: center;
        color: var(--question-text-color);
        margin-top: 30px;
        margin-bottom: 30px;
        font-weight: 600;
        transition: color 0.3s;
    }

</style>

<script>
    const quizData = [
        // Bacterial Morphology LOs
        {
            learningObjective: "LO1 (Bacterial Morphology): Differentiate between prokaryotes vs eukaryotes.",
            question: "A microbiologist is examining an unknown unicellular organism. The organism lacks a nuclear membrane, mitochondria, and an endoplasmic reticulum, but contains ribosomes and a cell wall. Its genetic material is a single, supercoiled chromosome in the cytoplasm. Which of the following best classifies this organism?",
            options: { A: "Eukaryote", B: "Prokaryote", C: "Fungus", D: "Protist", E: "Virus" },
            correctAnswer: "B",
            rationale: "The defining features of a prokaryote are the absence of a true nucleus and membrane-bound organelles like mitochondria. The presence of a single chromosome in the cytoplasm is also characteristic. Fungi and protists are eukaryotes. Viruses are not cellular.",
            source: "'Prokaryotic ie no nucleus containing genetic material. Single chromosome supercoiled in cell cytoplasm. No mitochondria, Golgi bodies, endoplasmic reticulum.' (Bacterial Morphology Handout, Page 1)"

        {

            options: { A: "Peptidoglycan", B: "Lipopolysaccharide", C: "Hopanoids", D: "Sterols", E: "Teichoic acids" },
            correctAnswer: "D",
            rationale: "Eukaryotic cell membranes contain sterols, such as cholesterol, which help maintain membrane stability and fluidity. Most prokaryotic membranes lack sterols, although some use similar molecules called hopanoids. Peptidoglycan and teichoic acids are cell wall components, not membrane components.",
            source: "'No sterols (eg cholesterol) in cell membrane.' (Bacterial Morphology Handout, Page 1). The diagram on slide 3 also explicitly notes that the eukaryotic cell membrane contains sterols."
        },
        {
            learningObjective: "LO1 (Bacterial Morphology): Differentiate between prokaryotes vs eukaryotes.",
            question: "An antimicrobial drug is developed that specifically targets the 80S ribosome to inhibit protein synthesis. Which of the following organisms would be most susceptible to this drug?",
            options: { A: "Staphylococcus aureus", B: "Escherichia coli", C: "Candida albicans", D: "Mycobacterium tuberculosis", E: "Chlamydia trachomatis" },
            correctAnswer: "C",
            rationale: "Eukaryotic cells, including fungi like Candida albicans, have 80S ribosomes (composed of 60S and 40S subunits). Prokaryotic cells, including all the listed bacteria, have 70S ribosomes (composed of 50S and 30S subunits). A drug targeting the 80S ribosome would affect the fungus but not the bacteria.",
            source: "'Bacterial ribosomes (total weight 70S) consisting of a heavier component (50S) and a lighter component (30S).' (Bacterial Morphology Handout, Page 9). 'EUKARYOTIC CELL [has] 80S [ribosomes]' (Bacterial Morphology Slides, Slide 56)"
        },
        {
            learningObjective: "LO2 (Bacterial Morphology): Differentiate between Gram (+) vs Gram (-)",

            source: "'Gram-positive cell walls. A Gram-positive cell wall contains a large amount of peptidoglycan on its surface.' (Bacterial Morphology Handout, Page 4). The diagram on slide 33 illustrates the thick peptidoglycan layer in Gram-positive bacteria."
        },
        {
            learningObjective: "LO2 (Bacterial Morphology): Differentiate between Gram (+) vs Gram (-)",
            question: "Which of the following components is found exclusively in the cell wall of Gram-negative bacteria and is responsible for many of its pathogenic properties, including endotoxin activity?",

            correctAnswer: "D",
            rationale: "Lipopolysaccharide (LPS) is a major component of the outer membrane of Gram-negative bacteria. It is not found in Gram-positive bacteria. The lipid A portion of LPS acts as an endotoxin, which can trigger a strong inflammatory response in the host. Teichoic and lipoteichoic acids are found in Gram-positive cell walls.",
            source: "'Contains lipopolysaccharide...Lipid portion blends with other phospholipid membrane components (lipid A). Tail of lipopolysaccharide & sticking out are various polysaccharides.' (Bacterial Morphology Handout, Page 7)"

        {
            learningObjective: "LO2 (Bacterial Morphology): Differentiate between Gram (+) vs Gram (-)",

            correctAnswer: "C",
            rationale: "The outer membrane of Gram-negative bacteria is a significant barrier. Porin proteins form channels or pores through this membrane, allowing for the passive diffusion of small, hydrophilic molecules into the periplasmic space. These structures are essential for nutrient uptake.",
            source: "'Outer membrane specialized and contains tubular proteins called porin proteins which form channels.' (Bacterial Morphology Handout, Page 7). Slide 40 shows a diagram of a porin protein allowing small solutes to pass while excluding large molecules like vancomycin."
        },
        {
            learningObjective: "LO3 (Bacterial Morphology): Explain Gram’s stain theory & technique",
            question: "In the Gram staining procedure, a substance is added after the crystal violet to form a complex with the dye, which helps it adhere more strongly to the bacterial cell wall. What is the term for this substance?",

            rationale: "A mordant is a substance that fixes a stain or dye, making it more resistant to removal. In the Gram stain, iodine acts as the mordant, forming a large crystal violet-iodine complex that gets trapped in the thick peptidoglycan of Gram-positive cells.",
            source: "'Add mordant (a substance which bonds the crystal violet to bacterial cell wall)—Gram’s iodine' (Bacterial Morphology Handout, Page 8). Slide 45 explicitly labels iodine's function as a mordant."

        {

            question: "A student performs a Gram stain on a known culture of E. coli, a Gram-negative rod. However, upon microscopic examination, the student observes purple rods. Which of the following procedural errors is the most likely cause of this result?",
            options: { A: "The safranin step was omitted.", B: "The decolorization step with alcohol was too brief.", C: "The slide was not heat-fixed properly.", D: "The iodine (mordant) step was omitted.", E: "The decolorization step with alcohol was too long." },
            correctAnswer: "B",
            rationale: "The decolorization step is critical for differentiating Gram-positive and Gram-negative bacteria. If this step is too short (under-decolorization), the crystal violet-iodine complex will not be sufficiently washed out of the thin peptidoglycan layer of Gram-negative cells, causing them to incorrectly appear purple (Gram-positive) instead of red.",
            source: "'If human cells noted are still blue (slide under-decolorized) mistake in technique.' (Bacterial Morphology Handout, Page 8). The same principle applies to bacteria; under-decolorizing will cause Gram-negative organisms to retain the blue/purple stain."
        },
        {
            learningObjective: "LO3 (Bacterial Morphology): Explain Gram’s stain theory & technique",

            correctAnswer: "D",
            rationale: "S. aureus, being Gram-positive, will retain the crystal violet-iodine complex and appear purple. P. aeruginosa, being Gram-negative, will be decolorized by the alcohol and will then take up the safranin counterstain, appearing red or pink.",
            source: "'One group of bacteria retains blue color because of abundance of peptidoglycan in their cell walls (Gram-positive). One group lost blue color in the wash & required re-staining with red safranin (Gram-negative).' (Bacterial Morphology Handout, Page 8)"

        {
            learningObjective: "LO4 (Bacterial Morphology): Identify basic structural features of bacteria.",
            question: "A bacterium is observed to possess long, filamentous appendages that rotate to propel the cell through a liquid medium. These structures are primarily composed of flagellin protein. What are these appendages called?",

            correctAnswer: "C",
            rationale: "Flagella are whip-like structures responsible for bacterial motility. They are composed of the protein flagellin and rotate like a propeller. Fimbriae and pili are involved in attachment, while the glycocalyx is a sugar coat. Cilia are found in eukaryotes.",
            source: "'Composed of a protein which can arrange itself into hollow cylinder 10-20 µm in length. Rotate either clockwise or counterclockwise at varying speeds.' (Bacterial Morphology Handout, Page 2)"
        },
        {
            learningObjective: "LO4 (Bacterial Morphology): Identify basic structural features of bacteria.",
            question: "A strain of E. coli is found to be highly adherent to bladder epithelial cells, a key step in causing urinary tract infections. This adherence is most likely mediated by which of the following surface structures?",

            rationale: "Fimbriae are short, sticky, hair-like projections that allow bacteria to adhere to surfaces, including host cells. This adherence is a critical virulence factor as it prevents the bacteria from being washed away and allows for colonization. While the glycocalyx can also aid attachment, fimbriae are the primary structures for specific adherence.",
            source: "'Sticky, non-motile, hair-like projections (“fringe”) around many bacteria...Mediate adherence to inert or biological surfaces (somatic pili) such as one another & target cells.' (Bacterial Morphology Handout, Page 2)"
        },
        {
            learningObjective: "LO4 (Bacterial Morphology): Identify basic structural features of bacteria.",
            question: "A strain of Streptococcus pneumoniae is particularly virulent because it can evade phagocytosis by host immune cells. This anti-phagocytic property is primarily due to which of the following structures?",
            options: { A: "Peptidoglycan", B: "Fimbriae", C: "A polysaccharide capsule", D: "A sex pilus", E: "An endospore" },
            correctAnswer: "C",
            rationale: "The capsule, a type of glycocalyx, is a tightly bound layer of extracellular polymer (usually polysaccharide) that surrounds the bacterial cell. Its slippery nature makes it difficult for phagocytes to engulf the bacterium. It also covers surface components (PAMPs) that would otherwise be recognized by the immune system.",
            source: "'Capsule: tightly bound layer adherent to the cell wall. a. Resists phagocytosis... c. Covers bacterial pathogen-associated molecular patterns (PAMPs).' (Bacterial Morphology Handout, Page 3)"

        {

        {

            source: "'Fts proteins localize to division site (divisome)... Fts Z→ polymerizes into tubulin → constricting Z ring.' (Bacterial Morphology Slides, Slide 36)"

        {

            correctAnswer: "C",
            rationale: "The divisome machinery coordinates the inward growth of the cell membrane and the synthesis of the peptidoglycan cell wall to form the septum. This cross-wall eventually splits, separating the two newly formed cells.",
            source: "'Fts proteins localize to division site (divisome)... peptidoglycan synthesis.' (Bacterial Morphology Slides, Slide 36)"
        },
        {

            correctAnswer: "B",

            source: "'septum separates forespore from mother cell.' (Bacterial Morphology Slides, Slide 60)"

        },
        {
            learningObjective: "LO7 (Bacterial Morphology): Outline the biochemical composition of peptidoglycan.",

            correctAnswer: "B",
            rationale: "The polysaccharide chains that form the rigid part of peptidoglycan consist of repeating units of N-acetylglucosamine (NAG) and N-acetylmuramic acid (NAM) linked together.",
            source: "'Rigid part are the chains of alternating, connected sugars, N-acetylmuramic acid (NAM) and N-acetylglucosamine (NAG).' (Bacterial Morphology Handout, Page 5)"

            source: "'Another chain of five glycines (in most bacteria) connecting the D-alanine in one chain to the adjacent lysine in the next chain.' (Bacterial Morphology Handout, Page 5)"
        },

            options: { A: "Streptococcus agalactiae", B: "Corynebacterium diphtheriae", C: "Listeria monocytogenes", D: "Bacillus cereus", E: "Clostridium tetani" },
            correctAnswer: "C",
            rationale: "Listeria monocytogenes is a small Gram-positive rod that can be mistaken for streptococci due to its beta-hemolysis, but it is catalase-positive. Its most unique laboratory feature is its characteristic tumbling motility when viewed in a wet mount from a broth culture grown at room temperature.",

            question: "A microbiologist is attempting to isolate Corynebacterium diphtheriae from a throat swab. The specimen is plated on a special medium containing potassium tellurite. What is the expected appearance of C. diphtheriae colonies on this selective medium?",

        }
    ];

    const quizContainer = document.getElementById('quiz-container');
    const themeToggleButton = document.getElementById('theme-toggle-button');
    const bodyElement = document.body;

    function applyTheme(theme) {
        if (theme === 'light') {
            bodyElement.classList.add('light-theme');
            themeToggleButton.textContent = 'Switch to Dark Mode';
        } else {
            bodyElement.classList.remove('light-theme');
            themeToggleButton.textContent = 'Switch to Light Mode';
        }
        localStorage.setItem('quizTheme', theme);
    }

    function loadQuiz() {
        quizData.forEach((qData, index) => {
            const questionBlock = document.createElement('div');
            questionBlock.classList.add('question-block');
            questionBlock.id = `q${index}`;

            const loText = document.createElement('div');
            loText.classList.add('learning-objective');
            
            // Store the full LO in a data attribute for later reveal
            loText.dataset.fullLo = qData.learningObjective; 
            
            // Use the obfuscated version if it exists, otherwise use the full one
            loText.innerHTML = qData.obfuscatedLO || qData.learningObjective; 
            
            questionBlock.appendChild(loText);

            const questionText = document.createElement('p');
            questionText.classList.add('question-text');
            questionText.innerHTML = `${index + 1}. ${qData.question}`;
            questionBlock.appendChild(questionText);

            const optionsDiv = document.createElement('div');
            optionsDiv.classList.add('options');

            for (const optionKey in qData.options) {
                const optionId = `q${index}_${optionKey}`;
                const label = document.createElement('label');
                label.htmlFor = optionId;
                const radioInput = document.createElement('input');
                radioInput.type = 'radio';
                radioInput.name = `q${index}`;
                radioInput.value = optionKey;
                radioInput.id = optionId;
                const labelText = document.createElement('span');
                labelText.textContent = ` ${optionKey}. ${qData.options[optionKey]}`;
                label.appendChild(radioInput);
                label.appendChild(labelText);
                optionsDiv.appendChild(label);
            }
            questionBlock.appendChild(optionsDiv);

            const buttonContainer = document.createElement('div');
            buttonContainer.classList.add('button-container');

            const checkButton = document.createElement('button');
            checkButton.textContent = 'Check Answer';
            checkButton.classList.add('check-button');
            checkButton.onclick = () => checkAnswer(index);
            buttonContainer.appendChild(checkButton);
            
            questionBlock.appendChild(buttonContainer);

            const feedbackDiv = document.createElement('div');
            feedbackDiv.classList.add('feedback');
            questionBlock.appendChild(feedbackDiv);

            quizContainer.appendChild(questionBlock);
        });
    }

    function checkAnswer(questionIndex) {
        const questionBlockElement = document.getElementById(`q${questionIndex}`);
        const selectedRadioButton = questionBlockElement.querySelector('input[type="radio"]:checked');

        if (!selectedRadioButton) {
            alert("Please select an answer first.");
            return;
        }

        const selectedOptionKey = selectedRadioButton.value;
        const qData = quizData[questionIndex];
        const feedbackDiv = questionBlockElement.querySelector('.feedback');
        const correct = selectedOptionKey === qData.correctAnswer;
        
        const loTextElement = questionBlockElement.querySelector('.learning-objective');
        
        // Reveal the full learning objective from the data attribute
        loTextElement.innerHTML = loTextElement.dataset.fullLo;

        let feedbackHTML = '';

        if (correct) {
            feedbackHTML = `<span class="feedback-status">Correct!</span>`;
            feedbackDiv.className = 'feedback correct';
        } else {
             feedbackHTML = `<span class="feedback-status">Incorrect. The correct answer is ${qData.correctAnswer}.</span>`;
            feedbackDiv.className = 'feedback incorrect';
        }

        feedbackHTML += `<div class="feedback-rationale"><strong>Rationale:</strong> ${qData.rationale}</div>`;
        feedbackHTML += `<div class="feedback-source"><strong>Source:</strong> ${qData.source}</div>`;
        feedbackDiv.innerHTML = feedbackHTML;
    }

    themeToggleButton.addEventListener('click', () => {
        if (bodyElement.classList.contains('light-theme')) {
            applyTheme('dark');
        } else {
            applyTheme('light');
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('quizTheme') || 'dark';
        applyTheme(savedTheme);
        loadQuiz();
    });

</script>
  
</body>
</html>
